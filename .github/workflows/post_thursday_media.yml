name: Post Thursday — Media

on:
  # Scheduled auto-post disabled 2026-08-26 — bypassed the xbot approval
  # gate (2026-06-27). Re-enable only once fully routed through xbot.
  # schedule:
  #   - cron: '0 16 * * 4'  # 12:00PM ET (UTC-4 EDT)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy yfinance matplotlib

      - name: Generate card and post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot/post.py media
