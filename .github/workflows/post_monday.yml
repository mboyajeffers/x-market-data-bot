name: Post Monday — Finance

on:
  # Scheduled auto-post disabled 2026-08-26 — this bypassed the human
  # approval gate (xbot CLI, added 2026-06-27) that every other posting path
  # is supposed to go through. Re-enable only once posting is fully routed
  # through xbot, or intentionally re-scoped. Manual runs still work below.
  # schedule:
  #   - cron: '30 12 * * 1'  # 8:30AM ET (UTC-4 EDT)
  workflow_dispatch:         # manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy yfinance matplotlib

      - name: Generate card and post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot/post.py finance
