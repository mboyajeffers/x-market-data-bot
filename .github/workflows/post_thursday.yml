name: Post Thursday — Compliance

on:
  # Re-enabled 2026-08-26 — content-level fix (no sponsor link/URL in any
  # main caption) removes the reason for gating; verify.py's automated
  # checks are the safety net now, not a human in the loop.
  schedule:
    - cron: '0 14 * * 4'  # 10:00AM ET (UTC-4 EDT)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy yfinance matplotlib

      - name: Generate card and post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot/post.py compliance

      # Same job as the main post — see post_monday.yml for why (GHA runners
      # don't persist post_log.json across jobs; same-job sleep avoids that).
      - name: Wait 90 minutes, then post thread reply
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          sleep 5400
          python bot/post_thread_reply.py compliance
