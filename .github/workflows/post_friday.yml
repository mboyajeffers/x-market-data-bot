name: Post Friday — Rotating Vertical

on:
  # Re-enabled 2026-08-26 — content-level fix (no sponsor link/URL in any
  # main caption) removes the reason for gating; verify.py's automated
  # checks are the safety net now, not a human in the loop.
  schedule:
    - cron: '0 16 * * 5'  # 12:00PM ET (UTC-4 EDT)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy yfinance matplotlib

      - name: Determine rotation vertical
        id: rotation
        run: |
          python3 -c "
          import datetime
          verticals = ['oilgas','betting','solar','gaming','media','ecommerce','weather']
          week = datetime.date.today().isocalendar()[1]
          vertical = verticals[week % 7]
          print(f'vertical={vertical}')
          " >> $GITHUB_OUTPUT

      - name: Generate card and post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot/post.py ${{ steps.rotation.outputs.vertical }}

      # Same job as the main post — see post_monday.yml for why (GHA runners
      # don't persist post_log.json across jobs; same-job sleep avoids that).
      # Reuses the same rotation output so the reply targets whichever
      # vertical the main post actually used.
      - name: Wait 90 minutes, then post thread reply
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          sleep 5400
          python bot/post_thread_reply.py ${{ steps.rotation.outputs.vertical }}
