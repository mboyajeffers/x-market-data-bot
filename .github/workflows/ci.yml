name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.15.0
      - name: Lint
        run: ruff check scripts/ bot/
      - name: Compile check (syntax + import structure)
        run: python -m py_compile scripts/*.py bot/*.py
