# Explicit rule set (ruff's documented stable defaults: pycodestyle errors +
# pyflakes) rather than relying on "no config = defaults", which drifted
# between ruff versions between local testing and CI and produced a false
# failure (pyupgrade/flynt modernization rules aren't relevant here).
[lint]
select = ["E4", "E7", "E9", "F"]
# E701/E702: allow compact single-line `if x: return y` in small mapping/dispatch
# helpers (fmt_pct, pct_color, trend_arrow, risk_class) -- a deliberate style
# choice for readability in short lookup functions, not an oversight.
ignore = ["E701", "E702"]
